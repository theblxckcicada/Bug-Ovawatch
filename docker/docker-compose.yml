services:
  shadowgrid:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: shadow-grid:3.1.0
    container_name: shadowgrid
    ports:
      - "${SHADOWGRID_BIND_ADDRESS:-0.0.0.0}:8080:8080"
    volumes:
      - shadowgrid-output:/app/output
      - shadowgrid-data:/app/data
    environment:
      - OUTPUT_DIR=/app/output
      - DATA_DIR=/app/data
      - DATABASE_DIR=/app/data/database
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - PDCP_API_KEY=${PDCP_API_KEY:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  shadowgrid-output:
    driver: local
  shadowgrid-data:
    driver: local
